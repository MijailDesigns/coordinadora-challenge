version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: coordinadora_db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    ports:
      - '3306:3306'
    volumes:
      - coordinadora_db_data:/var/lib/mysql
    restart: always
  redis:
    image: redis:alpine
    container_name: coordinadora_redis
    ports:
      - '6379:6379'
    restart: always

  app:
    build: .
    container_name: coordinadora_app
    ports:
      - '3000:3000'
    depends_on:
      - db
      - redis
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_TTL=${REDIS_TTL}
    restart: always
volumes:
  coordinadora_db_data:
